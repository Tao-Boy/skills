[project]
name = "book-db"
version = "0.1.0"
description = "Lossless import of MinerU-parsed math/physics textbooks into a searchable SQLite knowledge base, with CLI and MCP tools for agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
bookdb = "book_db.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
